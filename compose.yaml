services:
  mysql:
    image: mysql:8.4@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-game_exchange}"
      MYSQL_USER: "${MYSQL_USER:-gameexchange_app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./database/schema.sql
        target: /docker-entrypoint-initdb.d/01-schema.sql
        read_only: true
      # 当前 Compose 仅用于开发环境，因此会加载最小种子数据。
      - type: bind
        source: ./database/seed.sql
        target: /docker-entrypoint-initdb.d/02-seed.sql
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user=root --silent'
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    networks:
      - backend

  app:
    image: gameexchange:dev
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-game_exchange}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&allowPublicKeyRetrieval=true"
      DB_USERNAME: "${MYSQL_USER:-gameexchange_app}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      SIMULATOR_ENABLED: "${SIMULATOR_ENABLED:-false}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8080/vue/assets/js/app-config.js >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql-data:
    driver: local
