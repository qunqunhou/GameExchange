limit_req_zone $binary_remote_addr zone=gameexchange_http_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=gameexchange_http_conn_per_ip:10m;

upstream gameexchange_http_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/gameexchange-http.access.log;
    error_log /var/log/nginx/gameexchange-http.error.log warn;

    limit_req_status 429;
    limit_conn_status 429;

    location = /metrics {
        return 404;
    }

    location ^~ /metrics/ {
        return 404;
    }

    location / {
        limit_except GET POST {
            deny all;
        }

        limit_req zone=gameexchange_http_per_ip burst=40 nodelay;
        limit_conn gameexchange_http_conn_per_ip 20;

        proxy_pass http://gameexchange_http_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
