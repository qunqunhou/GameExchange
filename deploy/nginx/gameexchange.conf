upstream gameexchange_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name gameexchange.example.com;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gameexchange.example.com;

    ssl_certificate /etc/letsencrypt/live/gameexchange.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gameexchange.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HTTPS 完成验证并确认域名长期启用后，再评审开启 HSTS。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/gameexchange.access.log;
    error_log /var/log/nginx/gameexchange.error.log warn;

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://gameexchange_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
